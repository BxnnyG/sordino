version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]
    ignore:
      # Major versions need a person: they usually need code changes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # tract and ndarray must move together with the vendored DeepFilterNet (third_party/).
      - dependency-name: "tract-*"
      - dependency-name: "ndarray"
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
