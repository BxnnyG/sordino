[package]
name = "sordino-core"
description = "Sordino core: settings, DSP chain and DeepFilterNet wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
# Acoustic echo cancellation (WebRTC AEC3). Needs the system library webrtc-audio-processing-2.
echo = ["dep:webrtc-audio-processing", "dep:webrtc-audio-processing-config"]
# Same, but builds WebRTC audio processing from the bundled source (needs meson and ninja).
# Used for release packages on distros that do not ship webrtc-audio-processing-2.
echo-bundled = ["echo", "webrtc-audio-processing/bundled"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_json = "1"
log.workspace = true
thiserror.workspace = true
ndarray = "0.17"
webrtc-audio-processing = { version = "2.1", optional = true }
webrtc-audio-processing-config = { version = "2.1", optional = true }
deep_filter = { path = "../../third_party/deep_filter" }


[dev-dependencies]
env_logger.workspace = true
